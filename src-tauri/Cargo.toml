[package]
name = "cige-chan"
version = "3.0.0-dev"
description = "词格酱 · 中文歌词写作台"
authors = ["yukinsnow"]
edition = "2021"
rust-version = "1.77.2"

# 移动端需要 lib target，桌面端也不受影响，先放着
[lib]
name = "cige_chan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-opener = "2.5.5"

# 都是为了 Xcode 27 / iOS 27 SDK，vendor 里各自只改了一行，上游修了就删掉对应条目和目录
# swift-rs：默认的 swiftbuild 后端会拿 macOS SDK 编 iOS，补丁退回 --build-system native
# tao：UIScene 配置的 use-after-free（tao#1244），tauri 2.x 锁在 ^0.35 拿不到 0.37 的修复
[patch.crates-io]
swift-rs = { path = "vendor/swift-rs" }
tao = { path = "vendor/tao" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
