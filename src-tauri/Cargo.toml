[package]
name = "cige-chan"
version = "3.0.0-dev"
description = "词格酱 · 中文歌词写作台"
authors = ["yukinsnow"]
edition = "2021"
rust-version = "1.77.2"

# 移动端需要 lib target，桌面端也不受影响，先放着
[lib]
name = "cige_chan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
tauri-plugin-opener = "2.5.5"

# tauri 的 iOS 构建经 swift-rs 调 swift build，Xcode 27 下默认后端会让它拿 macOS SDK 编 iOS。
# 上游 1.0.8 没修，vendor 里只多了一行 --build-system native。上游修了就删掉这段和 vendor/
[patch.crates-io]
swift-rs = { path = "vendor/swift-rs" }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
