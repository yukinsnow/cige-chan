[package]
name = "cige-chan"
version = "2.0.2"
description = "词格酱 · 中文歌词写作台"
authors = ["yukinsnow"]
edition = "2021"
rust-version = "1.77.2"

# 移动端需要 lib target，桌面端也不受影响，先放着
[lib]
name = "cige_chan_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
