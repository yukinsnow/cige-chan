name: 构建验证与安装包

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'codex/ios-optimization'
  workflow_dispatch:        # 也可以在 Actions 页面手动点一下就构建

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_NAME: cige-chan       # 对应 tauri.conf.json 里的 mainBinaryName

jobs:
  web-tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-save playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/verify-mobile.cjs

  ios-simulator:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - run: brew install xcodegen
      - run: npm install
      - name: Initialize iOS project
        run: npx tauri ios init --ci --skip-targets-install
      - name: Build unsigned iOS simulator app
        run: npx tauri ios build --ci --target aarch64-sim -- CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
      - name: Collect simulator app
        shell: bash
        run: |
          mkdir -p dist
          app=$(find src-tauri/gen/apple -type d -name '*.app' -path '*iphonesimulator*' -print -quit)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" dist/cige-chan-ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ios-simulator
          path: dist/*
          if-no-files-found: error

  build:
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest        # Apple Silicon
            args: '--target aarch64-apple-darwin --bundles app'
            label: macos-arm64
          - platform: macos-latest        # Intel Mac
            args: '--target x86_64-apple-darwin --bundles app'
            label: macos-intel
          - platform: ubuntu-22.04
            args: '--bundles appimage'
            label: linux-x86_64
          - platform: windows-latest
            args: '--no-bundle'
            label: windows-x86_64

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Linux 依赖
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl wget file libxdo-dev libssl-dev

      - name: 安装 Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: 缓存 Rust 依赖
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm install

      # 注意：这里不传 tagName / releaseName，tauri-action 就只构建、不发布
      - name: 构建
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: ${{ matrix.args }}

      - name: 收集产物（Windows：原始 exe）
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist
          exe=$(ls src-tauri/target/release/*.exe | head -n 1)
          cp "$exe" "dist/${APP_NAME}-${{ matrix.label }}.exe"

      - name: 收集产物（Linux：AppImage）
        if: matrix.platform == 'ubuntu-22.04'
        shell: bash
        run: |
          mkdir -p dist
          img=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -n 1)
          cp "$img" "dist/${APP_NAME}-${{ matrix.label }}.AppImage"

      - name: 收集产物（macOS：.app 打包成 zip）
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          mkdir -p dist
          app=$(ls -d src-tauri/target/*/release/bundle/macos/*.app | head -n 1)
          ditto -c -k --sequesterRsrc --keepParent "$app" "dist/${APP_NAME}-${{ matrix.label }}.zip"

      - name: 上传中间产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载全部产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('manual-{0}', github.run_number) }}
          name: '词格酱 ${{ github.ref_name }}'
          draft: true
          prerelease: false
          files: dist/*
          body: |
            下载后直接运行，无需安装。这些包没有做付费签名，首次打开时系统会拦一下：

            - **Windows**：下载 `.exe` 双击即可（系统需自带 WebView2，Win10 1803+ / Win11 默认都有）。SmartScreen 弹窗点「更多信息」→「仍要运行」
            - **macOS**：下载 `.zip`，解压得到 `.app`，右键点它 →「打开」→ 再点弹窗里的「打开」（只需做一次）
            - **Linux**：`chmod +x *.AppImage` 后直接运行
