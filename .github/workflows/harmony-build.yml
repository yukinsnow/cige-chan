name: HarmonyOS native HAP (experimental)
on:
  workflow_dispatch:
  push:
    branches: ['codex/ios-optimization']
    paths:
      - 'src-harmony/**'
      - 'scripts/*harmony*'
      - '.github/workflows/harmony-build.yml'
permissions:
  contents: read
concurrency:
  group: harmony-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-hap:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Cache official command line tools
        id: sdk-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/harmony/command-line-tools
          key: harmony-clt-linux-5.1.0.840-full-v2
      - name: Download and verify official SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          base=https://repo.huaweicloud.com/harmonyos/ohpm/5.1.0
          archive=commandline-tools-linux-x64-5.1.0.840.zip
          curl --fail --location --retry 3 "$base/$archive" -o "$RUNNER_TEMP/harmony-sdk.zip"
          checksum=$(curl --fail --location --retry 3 "$base/$archive.sha256" | awk '{print $1}')
          echo "$checksum  $RUNNER_TEMP/harmony-sdk.zip" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/harmony"
          unzip -q "$RUNNER_TEMP/harmony-sdk.zip" -d "$RUNNER_TEMP/harmony"
      - name: Configure SDK
        shell: bash
        run: |
          clt="$RUNNER_TEMP/harmony/command-line-tools"
          echo "$clt/bin" >> "$GITHUB_PATH"
          echo "$clt/tool/node/bin" >> "$GITHUB_PATH"
          echo "DEVECO_SDK_HOME=$clt/sdk" >> "$GITHUB_ENV"
          chmod +x "$clt/bin/ohpm" "$clt/bin/hvigorw" "$clt/tool/node/bin/node"
      - name: Save complete SDK cache
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/harmony/command-line-tools
          key: harmony-clt-linux-5.1.0.840-full-v2
      - name: Stage local editor and check native bridge
        run: |
          node scripts/prepare-harmony.cjs
          node scripts/verify-harmony-bridge.cjs
      - name: Install HarmonyOS dependencies
        working-directory: src-harmony
        run: ohpm install
      - name: Build unsigned HAP
        working-directory: src-harmony
        run: hvigorw assembleHap --mode module -p product=default -p module=entry@default -p buildMode=release --no-daemon --stacktrace
      - name: Verify packaged editor
        run: python3 scripts/verify-harmony-hap.py
      - uses: actions/upload-artifact@v4
        with:
          name: harmonyos-unsigned
          path: src-harmony/entry/build/default/outputs/default/*unsigned.hap
          if-no-files-found: error
